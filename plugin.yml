name: KP-PVP
main: me.RafaelAulerDeMeloAraujo.main.Main
version: 'BUILD-206'
author: Noleexy or Rafael Auler
softdepend:
  - PlaceholderAPI
  - MVdWPlaceholderAPI
  - Vault
  - PlayerPoints
  - KPCore
  - WorldGuard
description: >-
  KitPvP plugin with kits, a shop with custom economy support, a unique 1v1 system,
  coins, scoreboard, kill/death/streak statistics, sponge launchpads, customizable
  commands, support for other game modes such as SkyWars, and server management features.
  The plugin is free to download. Support the developer by subscribing to the channel.
website: "http://bit.ly/2kC345B"
api-version: '1.21.11'
folia-supported: true
# Permissions reference: https://pastebin.com/JuMPHpRD
